plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Farmer's Delight Refabricated, from the Modrinth maven.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.x is unobfuscated, so there are no mappings and no mod* configurations.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:farmers-delight-refabricated:${project.delight_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs << "-Xmaxerrs" << "2000"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
// Temporary helper while porting: searches the game and mod jars and writes what it finds to dump.txt.
// Run with: gradlew dumpInfo
tasks.register('dumpInfo') {
	doLast {
		def out = new StringBuilder()
		def seen = [] as Set
		def printFiles = [
			'assets/farmersdelight/blockstates/apple_pie.json',
			'assets/farmersdelight/models/block/pie.json',
			'assets/farmersdelight/models/block/pie_slice1.json',
			'data/farmersdelight/worldgen/configured_feature/wild_cabbages.json',
			'data/minecraft/villager_trade/wandering_trader/emerald_oak_sapling.json',
			'data/minecraft/villager_trade/wandering_trader/emerald_wheat_seeds.json',
			'data/minecraft/villager_trade/farmer/1/wheat_emerald.json',
			'data/minecraft/villager_trade/farmer/1/emerald_bread.json',
			'data/minecraft/trade_set/farmer/level_1.json',
			'data/minecraft/trade_set/wandering_trader/common.json',
			'data/minecraft/tags/villager_trade/farmer/level_1.json',
			'data/farmersdelight/villager_trade/wandering_trader/cabbage_emerald.json']
		configurations.compileClasspath.files.findAll { it.name.endsWith('.jar') }.each { jar ->
			def zip = new java.util.zip.ZipFile(jar)
			try {
				def fab = jar.name.contains('fabric')
				def mc = jar.name.contains('minecraft')
				Collections.list(zip.entries()).each { e ->
					def n = e.name
					if (e.isDirectory() || !seen.add(n)) return
					if (n in printFiles) {
						out.append("==== ${n}  (${jar.name})\n")
						out.append(zip.getInputStream(e).getText('UTF-8').readLines().take(120).join('\n')).append('\n')
					}
					if (n.startsWith('assets/farmersdelight/') && n.contains('pie')) out.append("LIST ${n}\n")
					if (n.startsWith('data/farmersdelight/') && (n.contains('/worldgen/') || n.contains('villager_trade') || n.contains('trade_set'))) out.append("LIST ${n}\n")
					if (n.startsWith('data/minecraft/worldgen/configured_feature/') && (n.contains('patch') || n.contains('berry') || n.contains('sugar') || n.contains('flower'))) out.append("LIST ${n}\n")
					if (fab && n.startsWith('net/fabricmc/fabric/api/client/rendering/v1/') && n.endsWith('.class') && !n.contains('$')) out.append("LIST ${n}\n")
					if (fab && n.endsWith('.class') && n.contains('/api/')) {
						def text = new String(zip.getInputStream(e).readAllBytes(), 'ISO-8859-1')
						if (text.contains('ChunkSectionLayer')) out.append("REFS ChunkSectionLayer: ${n}  (${jar.name})\n")
					}
					if (mc && n.endsWith('.class') && (n.contains('ChunkSectionLayer') || n.contains('BlockRenderType') || n.contains('ItemBlockRender'))) out.append("MC ${n}\n")
				}
			} finally {
				zip.close()
			}
		}
		file('dump.txt').text = out.toString()
		println "Wrote ${file('dump.txt').absolutePath} (${out.length()} characters)"
	}
}

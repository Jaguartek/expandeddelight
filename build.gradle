plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Farmer's Delight Refabricated, from the Modrinth maven.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.x is unobfuscated, so there are no mappings and no mod* configurations.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:farmers-delight-refabricated:${project.delight_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs << "-Xmaxerrs" << "2000"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
// Temporary helper while porting: searches the game and mod jars and writes what it finds to dump.txt.
// Run with: gradlew dumpInfo
tasks.register('dumpInfo') {
	doLast {
		def out = new StringBuilder()
		def seen = [] as Set
		def fileStarts = [
			'data/minecraft/worldgen/configured_feature/patch_sugar_cane',
			'data/minecraft/worldgen/configured_feature/patch_berry_bush',
			'data/minecraft/worldgen/configured_feature/oak.json',
			'data/farmersdelight/worldgen/configured_feature/patch_wild_cabbages',
			'data/farmersdelight/worldgen/placed_feature/patch_wild_cabbages']
		def tradeDirs = ['data/minecraft/tags/villager_trade/', 'data/minecraft/trade_set/', 'data/minecraft/villager_trade/']
		def tradeShown = 0
		configurations.compileClasspath.files.findAll { it.name.endsWith('.jar') }.each { jar ->
			def zip = new java.util.zip.ZipFile(jar)
			try {
				def fab = jar.name.contains('fabric')
				def fd = jar.name.contains('farmers')
				Collections.list(zip.entries()).each { e ->
					def n = e.name
					if (n.endsWith('.class') && ((fab && (n.contains('LayerMap') || n.contains('BlockRenderLayer') || n.contains('/biome/v1/'))) || (fd && n.matches(/.*(WildCrop|BiomeTag|Feature|Worldgen|WorldGen).*/)))) {
						out.append("CLASS ${n}  (${jar.name})\n")
					}
					if (n.startsWith('data/') && !n.endsWith('/') && seen.add(n)) {
						boolean trade = tradeDirs.any { n.startsWith(it) } && (n.contains('wandering') || n.contains('farmer'))
						if (trade) out.append("TRADEFILE ${n}\n")
						boolean show = fileStarts.any { n.startsWith(it) } || (trade && n.contains('wandering') && tradeShown++ < 4)
						if (show) {
							out.append("==== ${n}  (${jar.name})\n")
							out.append(zip.getInputStream(e).getText('UTF-8').readLines().take(70).join('\n')).append('\n')
						}
					}
				}
			} finally {
				zip.close()
			}
		}
		file('dump.txt').text = out.toString()
		println "Wrote ${file('dump.txt').absolutePath} (${out.length()} characters)"
	}
}

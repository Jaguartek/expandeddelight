plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Farmer's Delight Refabricated, from the Modrinth maven.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.x is unobfuscated, so there are no mappings and no mod* configurations.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:farmers-delight-refabricated:${project.delight_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs << "-Xmaxerrs" << "2000"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Temporary helper while porting: prints files from the game and mod jars into dump.txt.
// Usage: gradlew dumpInfo "-PdumpPrint=path/a.json,path/folder/*" "-PdumpList=path/prefix/"
// A path ending in /* prints the first two files in that folder. dumpList only lists file names.
// dumpJavap takes class file paths and prints their bytecode (javap -c -p).
tasks.register('dumpInfo') {
	doLast {
		def prints = (project.findProperty('dumpPrint') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
		def javaps = (project.findProperty('dumpJavap') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
		def lists = (project.findProperty('dumpList') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
		def out = new StringBuilder()
		def seen = [] as Set
		def shown = [:].withDefault { 0 }
		configurations.compileClasspath.files.findAll { it.name.endsWith('.jar') }.each { jar ->
			def zip = new java.util.zip.ZipFile(jar)
			try {
				Collections.list(zip.entries()).each { e ->
					def n = e.name
					if (e.isDirectory() || !seen.add(n)) return
					prints.each { p ->
						boolean hit = p.endsWith('/*') ? (n.startsWith(p.substring(0, p.length() - 1)) && shown[p]++ < 2) : n == p
						if (hit) {
							out.append("==== ${n}  (${jar.name})\n")
							out.append(zip.getInputStream(e).getText('UTF-8').readLines().take(120).join('\n')).append('\n')
						}
					}
					if (lists.any { n.startsWith(it) }) out.append("LIST ${n}\n")
					if (n in javaps) {
						def tmp = java.nio.file.Files.createTempDirectory('dumpjavap').toFile()
						def target = new File(tmp, n); target.parentFile.mkdirs()
						target.bytes = zip.getInputStream(e).readAllBytes()
						def bin = new File(System.getProperty('java.home'), 'bin')
						def exe = new File(bin, 'javap.exe').exists() ? new File(bin, 'javap.exe') : new File(bin, 'javap')
						def proc = new ProcessBuilder(exe.absolutePath, '-c', '-p', '-cp', tmp.absolutePath, n.replace('/', '.').replace('.class', '')).redirectErrorStream(true).start()
						out.append("==== javap ${n}\n").append(proc.inputStream.getText('UTF-8')).append('\n')
					}
				}
			} finally {
				zip.close()
			}
		}
		file('dump.txt').text = out.toString()
		println "Wrote ${file('dump.txt').absolutePath} (${out.length()} characters)"
	}
}
